<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autenticação - Ordem Paranormal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="landing.css">
    <style>
        .erro-msg { color: #ff5555; font-size: 13px; text-align: center; margin-top: 10px; }
    </style>
</head>
<body class="auth-body">

    <div class="bg-glow bg-glow-1"></div>

    <div class="auth-container">
        <!-- Voltar para a página inicial -->
        <a href="../index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Voltar</a>
        
        <div class="auth-card">
            <div class="auth-header">
                <i class="fa-solid fa-spaghetti-monster-flying logo-icon"></i>
                <h2 id="auth-title">ACESSAR SISTEMA</h2>
            </div>

            <!-- Formulário de Login / Cadastro -->
            <form id="auth-form" class="auth-form">
                <div class="input-group" id="name-group" style="display: none;">
                    <label for="name">Nome de Agente</label>
                    <input type="text" id="name" placeholder="Como devemos te chamar?">
                </div>

                <div class="input-group">
                    <label for="email">Email Confidencial</label>
                    <input type="email" id="email" placeholder="seu@email.com" required>
                </div>

                <div class="input-group">
                    <label for="password">Senha de Acesso</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-primary auth-submit" id="auth-btn">ENTRAR</button>
            </form>

            <div class="auth-divider">
                <span>OU</span>
            </div>

            <!-- Botão Google -->
            <button class="btn-google" id="google-login" type="button">
                <svg width="25" height="25" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M21.35 12.27c0-.71-.06-1.39-.18-2.05H12v3.88h5.24a4.48 4.48 0 0 1-1.94 2.94v2.44h3.14c1.84-1.69 2.91-4.18 2.91-7.21z"/>
                    <path fill="#34A853" d="M12 21.5c2.63 0 4.84-.87 6.45-2.36l-3.14-2.44c-.87.58-1.98.92-3.31.92-2.54 0-4.69-1.72-5.46-4.03H3.29v2.52A9.75 9.75 0 0 0 12 21.5z"/>
                    <path fill="#FBBC05" d="M6.54 13.59A5.86 5.86 0 0 1 6.23 12c0-.55.11-1.09.31-1.59V7.89H3.29A9.75 9.75 0 0 0 2.25 12c0 1.57.38 3.05 1.04 4.11l3.25-2.52z"/>
                    <path fill="#EA4335" d="M12 6.38c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.84 3.4 14.63 2.5 12 2.5a9.75 9.75 0 0 0-8.71 5.39l3.25 2.52C7.31 8.1 9.46 6.38 12 6.38z"/>
                </svg>
                Continuar com o Google
            </button>

            <!-- Mensagem de Erro -->
            <p id="mensagem-erro" class="erro-msg"></p>

            <!-- Alternar Login/Cadastro -->
            <div class="auth-toggle">
                <p id="toggle-text">Não tem credenciais?</p>
                <button type="button" id="toggle-btn" class="toggle-link">Solicitar Acesso (Cadastrar)</button>
            </div>
        </div>
    </div>

    <!-- Script de controle visual (Alternar entre Entrar e Cadastrar) -->
    <script type="module">
        const urlParams = new URLSearchParams(window.location.search);
        let isRegisterMode = urlParams.get('mode') === 'register';

        const authTitle = document.getElementById('auth-title');
        const authBtn = document.getElementById('auth-btn');
        const nameGroup = document.getElementById('name-group');
        const toggleText = document.getElementById('toggle-text');
        const toggleBtn = document.getElementById('toggle-btn');

        function updateUI() {
            if (isRegisterMode) {
                authTitle.innerText = 'NOVO REGISTRO';
                authBtn.innerText = 'CADASTRAR CONTA';
                nameGroup.style.display = 'block';
                toggleText.innerText = 'Já possui credenciais?';
                toggleBtn.innerText = 'Fazer Login';
            } else {
                authTitle.innerText = 'ACESSAR SISTEMA';
                authBtn.innerText = 'ENTRAR';
                nameGroup.style.display = 'none';
                toggleText.innerText = 'Não tem credenciais?';
                toggleBtn.innerText = 'Solicitar Acesso (Cadastrar)';
            }
        }

        toggleBtn.addEventListener('click', () => {
            isRegisterMode = !isRegisterMode;
            updateUI();
        });

        updateUI();

        // Expõe o estado para o auth.js gerenciar o Firebase corretamente
        window.getIsRegisterMode = () => isRegisterMode;
    </script>

    <!-- Script principal do Firebase (ligado à raiz) -->
    <script type="module" src="../auth.js"></script>
</body>
</html>
