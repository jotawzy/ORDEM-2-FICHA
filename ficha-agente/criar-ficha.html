<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Agentes - ORDEM PARANORMAL 2</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >

    <link
        rel="stylesheet"
        href="../auth/landing.css"
    >

    <link
        rel="stylesheet"
        href="../ficha-agente/criar-ficha.css"
    >
</head>

<body>

    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <header class="navbar">

        <div class="nav-logo">
            <i class="fa-solid fa-spaghetti-monster-flying logo-icon"></i>
            <span class="logo-text">AGULHAS</span>
        </div>

        <nav class="nav-links">
            <a href="#agentes">Agentes</a>
        </nav>

        <div class="nav-auth">
            <button
                id="btn-sair"
                class="btn-secondary"
                type="button"
            >
                SAIR
            </button>
        </div>

    </header>

    <main class="dashboard-container">

        <div class="agentes-bar">

            <h2>MEUS AGENTES</h2>

            <div class="agentes-controles">

                <button
                    id="btn-criar-agente"
                    class="btn-primary btn-large"
                    type="button"
                >
                    + CRIAR AGENTE
                </button>

                <div
                    id="contador-fichas"
                    class="contador-fichas"
                    aria-live="polite"
                >
                    FICHAS 0/10
                </div>

            </div>

        </div>

        <div
            id="lista-agentes"
            class="grid-agentes"
        >
            <!-- Os cards dos agentes entram aqui -->
        </div>

    </main>

    <script type="module">
    import {
        auth,
        db,
        collection,
        addDoc,
        getDocs,
        query,
        where,
        doc,
        getDoc,
        deleteDoc
    } from "../firebase-config.js";

    import {
        onAuthStateChanged,
        signOut
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";


    const listaAgentesDiv =
        document.getElementById("lista-agentes");

    const btnCriarAgente =
        document.getElementById("btn-criar-agente");

    const btnSair =
        document.getElementById("btn-sair");

    const contadorFichas =
        document.getElementById("contador-fichas");


    const COLECAO_FICHAS = "fichas";

    const COLECAO_CONFIG = "configuracoes";
    const DOC_CONFIG = "sistema";
    const CAMPO_LIMITE = "limiteFichas";
    const CAMPO_LIMITES_USUARIOS = "limitesPorUsuario";

    const LIMITE_PADRAO = 10;


    let usuarioAtual = null;
    let totalAgentes = 0;
    let limiteAgentes = LIMITE_PADRAO;


    btnCriarAgente.disabled = true;


    function definirCor(perfil) {

        const p =
            perfil
                ? perfil.toLowerCase()
                : "";


        if (p.includes("vigilante")) {
            return "#2da83b";
        }


        if (
            p.includes("combatente") ||
            p.includes("executor")
        ) {
            return "#a82d2d";
        }


        if (p.includes("ocultista")) {
            return "#8a2da8";
        }


        if (
            p.includes("especialista") ||
            p.includes("analista") ||
            p.includes("medico")
        ) {
            return "#2d69a8";
        }


        return "#2da83b";
    }


    function obterDataCriacao(valor) {

        if (!valor) {
            return 0;
        }


        if (
            typeof valor.toMillis === "function"
        ) {
            return valor.toMillis();
        }


        if (valor instanceof Date) {
            return valor.getTime();
        }


        if (typeof valor === "number") {
            return valor;
        }


        if (typeof valor === "string") {

            const tempo =
                new Date(valor).getTime();

            return Number.isFinite(tempo)
                ? tempo
                : 0;
        }


        if (
            typeof valor.seconds === "number"
        ) {

            return (
                valor.seconds * 1000 +
                Math.floor(
                    (valor.nanoseconds || 0) /
                    1000000
                )
            );
        }


        return 0;
    }


    function atualizarContador() {

        contadorFichas.textContent =
            `FICHAS ${totalAgentes}/${limiteAgentes}`;


        const limiteAtingido =
            totalAgentes >= limiteAgentes;


        contadorFichas.classList.toggle(
            "limite-atingido",
            limiteAtingido
        );


        if (limiteAtingido) {

            btnCriarAgente.disabled = true;

            btnCriarAgente.textContent =
                "LIMITE ATINGIDO";

            btnCriarAgente.classList.add(
                "bloqueado"
            );

        } else {

            btnCriarAgente.disabled = false;

            btnCriarAgente.textContent =
                "+ CRIAR AGENTE";

            btnCriarAgente.classList.remove(
                "bloqueado"
            );
        }
    }


    async function carregarLimiteFichas(uid) {

        limiteAgentes =
            LIMITE_PADRAO;


        try {

            const referenciaConfig =
                doc(
                    db,
                    COLECAO_CONFIG,
                    DOC_CONFIG
                );


            const snapshot =
                await getDoc(
                    referenciaConfig
                );


            if (!snapshot.exists()) {

                atualizarContador();

                return;
            }


            const dados =
                snapshot.data();


            const limitesPorUsuario =
                dados?.[CAMPO_LIMITES_USUARIOS];


            if (
                limitesPorUsuario &&
                typeof limitesPorUsuario === "object"
            ) {

                const limiteIndividual =
                    Number(
                        limitesPorUsuario[uid]
                    );


                if (
                    Number.isFinite(limiteIndividual) &&
                    limiteIndividual >= 0
                ) {

                    limiteAgentes =
                        Math.floor(
                            limiteIndividual
                        );

                    atualizarContador();

                    return;
                }
            }


            const limiteGlobal =
                Number(
                    dados?.[CAMPO_LIMITE]
                );


            if (
                Number.isFinite(limiteGlobal) &&
                limiteGlobal >= 0
            ) {

                limiteAgentes =
                    Math.floor(
                        limiteGlobal
                    );
            }

        } catch (erro) {

            console.warn(
                "FICHAS: não foi possível carregar o limite. Usando 10.",
                erro
            );

            limiteAgentes =
                LIMITE_PADRAO;
        }


        atualizarContador();
    }


    onAuthStateChanged(
        auth,
        async user => {

            if (user) {

                usuarioAtual =
                    user;


                await carregarLimiteFichas(
                    user.uid
                );


                await carregarAgentes(
                    user.uid
                );

            } else {

                window.location.href =
                    "../auth/login.html";
            }
        }
    );


    async function carregarAgentes(uid) {

        listaAgentesDiv.innerHTML =
            "<p style='color: #888;'>A carregar agentes...</p>";


        try {

            const q =
                query(
                    collection(
                        db,
                        COLECAO_FICHAS
                    ),
                    where(
                        "uid",
                        "==",
                        uid
                    )
                );


            const querySnapshot =
                await getDocs(q);


            const agentes = [];


            querySnapshot.forEach(
                documento => {

                    agentes.push({
                        id: documento.id,
                        ...documento.data()
                    });
                }
            );


            agentes.sort(
                (a, b) => {

                    return (
                        obterDataCriacao(
                            b.criadoEm
                        ) -
                        obterDataCriacao(
                            a.criadoEm
                        )
                    );
                }
            );


            totalAgentes =
                agentes.length;


            atualizarContador();


            listaAgentesDiv.innerHTML =
                "";


            if (agentes.length === 0) {

                listaAgentesDiv.innerHTML =
                    "<p style='color: #888;'>Ainda não tens nenhum agente registado. Clica em '+ CRIAR AGENTE' para começar.</p>";

                return;
            }


            agentes.forEach(
                agente => {

                    const corPerfil =
                        definirCor(
                            agente.perfil
                        );


                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "card-agente";


                    card.style.cssText = `
                        display: flex;
                        background: #0d0d0d;
                        border: 2px solid ${corPerfil};
                        border-radius: 4px;
                        overflow: hidden;
                        cursor: pointer;
                        transition: transform 0.2s, box-shadow 0.2s;
                        position: relative;
                        height: 150px;
                        width: 100%;
                        max-width: 380px;
                        box-sizing: border-box;
                        box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
                    `;


                    const fotoHtml =
                        agente.fotoUrl &&
                        agente.fotoUrl.trim() !== ""

                        ? `
                            <img
                                src="${agente.fotoUrl}"
                                style="
                                    width: 100%;
                                    height: 100%;
                                    object-fit: cover;
                                    object-position: top;
                                "
                            >
                        `

                        : `
                            <img
                                src="../assets/val-default.png"
                                onerror="this.onerror=null; this.style.display='none';"
                                style="
                                    width: 100%;
                                    height: 100%;
                                    object-fit: cover;
                                    object-position: top;
                                "
                            >

                            <i
                                class="fa-solid fa-user"
                                style="
                                    font-size: 50px;
                                    color: rgba(0,0,0,0.4);
                                    position: absolute;
                                "
                            ></i>
                        `;


                    card.innerHTML = `

                        <div
                            style="
                                width: 35%;
                                background: ${corPerfil};
                                position: relative;
                                display: flex;
                                justify-content: center;
                                align-items: center;
                                overflow: hidden;
                                border-right: 2px solid ${corPerfil};
                                flex-shrink: 0;
                            "
                        >
                            ${fotoHtml}
                        </div>


                        <div
                            style="
                                width: 65%;
                                padding: 10px 12px;
                                display: flex;
                                flex-direction: column;
                                justify-content: space-between;
                                box-sizing: border-box;
                                overflow: hidden;
                                position: relative;
                            "
                        >

                            <div>

                                <div
                                    style="
                                        display: flex;
                                        align-items: center;
                                        gap: 5px;
                                        overflow: hidden;
                                        white-space: nowrap;
                                    "
                                >

                                    <span
                                        style="
                                            background: ${corPerfil};
                                            color: #fff;
                                            padding: 2px 6px;
                                            font-weight: bold;
                                            font-size: 10px;
                                            text-transform: uppercase;
                                            clip-path: polygon(
                                                0 0,
                                                100% 0,
                                                95% 100%,
                                                0 100%
                                            );
                                            flex-shrink: 0;
                                        "
                                    >
                                        ${agente.perfil || "VIGILANTE"}
                                    </span>


                                    <span
                                        style="
                                            color: #ccc;
                                            font-size: 10px;
                                            text-transform: uppercase;
                                            font-weight: 600;
                                            overflow: hidden;
                                            text-overflow: ellipsis;
                                            white-space: nowrap;
                                        "
                                    >
                                        • ${agente.ocupacao || "OCUPAÇÃO"}
                                    </span>

                                </div>


                                <h3
                                    style="
                                        color: ${corPerfil};
                                        font-size: 20px;
                                        margin: 4px 0;
                                        text-transform: uppercase;
                                        font-family: 'Times New Roman', serif;
                                        letter-spacing: 1px;
                                        text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
                                        white-space: nowrap;
                                        overflow: hidden;
                                        text-overflow: ellipsis;
                                    "
                                >
                                    ${agente.nome || "NOME"}
                                </h3>


                                <div
                                    style="
                                        height: 1px;
                                        background: ${corPerfil};
                                        width: 100%;
                                        margin: 4px 0;
                                        opacity: 0.5;
                                    "
                                ></div>

                            </div>


                            <div
                                style="
                                    display: flex;
                                    justify-content: flex-start;
                                    align-items: flex-end;
                                "
                            >

                                <span
                                    style="
                                        color: ${corPerfil};
                                        font-size: 11px;
                                        font-weight: 500;
                                        line-height: 1.2;
                                    "
                                >
                                    • Ficha de<br>
                                    &nbsp;&nbsp;Personagem
                                </span>

                            </div>


                            <div
                                class="nivel-card"
                                style="
                                    position: absolute;
                                    right: 10px;
                                    bottom: 18px;
                                    text-align: right;
                                    line-height: 1;
                                    z-index: 5;
                                "
                            >

                                <span
                                    style="
                                        color: #fff;
                                        font-size: 9px;
                                        text-transform: uppercase;
                                        font-weight: bold;
                                        display: block;
                                        margin-bottom: 2px;
                                    "
                                >
                                    NÍVEL
                                </span>


                                <div
                                    style="
                                        background: ${corPerfil};
                                        color: #fff;
                                        display: inline-block;
                                        padding: 6px 13px;
                                        font-size: 19px;
                                        font-weight: bold;
                                        margin: 0;
                                        line-height: 1;
                                        clip-path: polygon(
                                            3% 2%,
                                            22% 5%,
                                            45% 1%,
                                            72% 4%,
                                            95% 2%,
                                            98% 25%,
                                            95% 50%,
                                            99% 75%,
                                            96% 95%,
                                            70% 98%,
                                            40% 95%,
                                            15% 99%,
                                            2% 96%,
                                            0 70%,
                                            4% 40%,
                                            1% 20%
                                        );
                                    "
                                >
                                    ${agente.nivel || 1}
                                </div>

                            </div>

                        </div>
                    `;


                    const btnExcluir =
                        document.createElement(
                            "button"
                        );


                    btnExcluir.type =
                        "button";


                    btnExcluir.className =
                        "btn-excluir-agente";


                    btnExcluir.setAttribute(
                        "aria-label",
                        `Excluir ${agente.nome || "ficha"}`
                    );


                    btnExcluir.title =
                        "Excluir ficha";


                    btnExcluir.innerHTML =
                        '<i class="fa-solid fa-trash-can"></i>';


                    btnExcluir.style.color =
                        corPerfil;


                    card.appendChild(
                        btnExcluir
                    );


                    card.addEventListener(
                        "mouseenter",
                        () => {

                            card.style.transform =
                                "scale(1.02)";

                            card.style.boxShadow =
                                `0 0 15px ${corPerfil}40`;
                        }
                    );


                    card.addEventListener(
                        "mouseleave",
                        () => {

                            card.style.transform =
                                "scale(1)";

                            card.style.boxShadow =
                                "inset 0 0 20px rgba(0,0,0,0.8)";
                        }
                    );


                    card.addEventListener(
                        "click",
                        () => {

                            localStorage.setItem(
                                "fichaIdAtiva",
                                agente.id
                            );

                            window.location.href =
                                "ficha.html";
                        }
                    );


                    btnExcluir.addEventListener(
                        "mouseenter",
                        () => {

                            btnExcluir.style.background =
                                corPerfil;

                            btnExcluir.style.color =
                                "#fff";

                            btnExcluir.style.boxShadow =
                                `0 0 12px ${corPerfil}55`;
                        }
                    );


                    btnExcluir.addEventListener(
                        "mouseleave",
                        () => {

                            btnExcluir.style.background =
                                "transparent";

                            btnExcluir.style.color =
                                corPerfil;

                            btnExcluir.style.boxShadow =
                                "none";
                        }
                    );


                    btnExcluir.addEventListener(
                        "click",
                        async event => {

                            event.preventDefault();
                            event.stopPropagation();


                            const nome =
                                agente.nome &&
                                agente.nome !== "NOME"
                                    ? agente.nome
                                    : "esta ficha";


                            const confirmou =
                                confirm(
                                    `Excluir ${nome}?\n\nEsta ação não pode ser desfeita.`
                                );


                            if (!confirmou) {
                                return;
                            }


                            btnExcluir.disabled =
                                true;


                            btnExcluir.innerHTML =
                                '<i class="fa-solid fa-spinner fa-spin"></i>';


                            try {

                                await deleteDoc(
                                    doc(
                                        db,
                                        COLECAO_FICHAS,
                                        agente.id
                                    )
                                );


                                if (
                                    localStorage.getItem(
                                        "fichaIdAtiva"
                                    ) === agente.id
                                ) {

                                    localStorage.removeItem(
                                        "fichaIdAtiva"
                                    );
                                }


                                await carregarAgentes(
                                    usuarioAtual.uid
                                );

                            } catch (error) {

                                console.error(
                                    "Erro ao excluir agente:",
                                    error
                                );


                                alert(
                                    "Não foi possível excluir esta ficha."
                                );


                                btnExcluir.disabled =
                                    false;


                                btnExcluir.innerHTML =
                                    '<i class="fa-solid fa-trash-can"></i>';
                            }
                        }
                    );


                    listaAgentesDiv.appendChild(
                        card
                    );

                }
            );

        } catch (error) {

            console.error(
                "Erro ao carregar agentes:",
                error
            );


            listaAgentesDiv.innerHTML =
                "<p style='color: #ff5555;'>Erro ao carregar os dados dos agentes.</p>";


            atualizarContador();
        }
    }


    btnCriarAgente.addEventListener(
        "click",
        async () => {

            if (!usuarioAtual) {
                return;
            }


            if (
                totalAgentes >=
                limiteAgentes
            ) {

                atualizarContador();

                alert(
                    `Você atingiu o limite de ${limiteAgentes} fichas por usuário.`
                );

                return;
            }


            try {

                btnCriarAgente.innerText =
                    "A CRIAR...";


                btnCriarAgente.disabled =
                    true;


                const novoAgente = {

                    uid:
                        usuarioAtual.uid,

                    nome:
                        "NOME",

                    ocupacao:
                        "OCUPAÇÃO",

                    perfil:
                        "Vigilante",

                    nivel:
                        1,

                    classe:
                        "Recruta",

                    patente:
                        "Operativo",

                    fotoUrl:
                        "",

                    atributos: {
                        agilidade: 6,
                        forca: 6,
                        intelecto: 6,
                        presenca: 6,
                        vigor: 6
                    },

                    criadoEm:
                        new Date()
                };


                const docRef =
                    await addDoc(
                        collection(
                            db,
                            COLECAO_FICHAS
                        ),
                        novoAgente
                    );


                localStorage.setItem(
                    "fichaIdAtiva",
                    docRef.id
                );


                window.location.href =
                    "ficha.html";

            } catch (error) {

                console.error(
                    "Erro ao criar agente:",
                    error
                );


                alert(
                    "Erro ao criar nova ficha."
                );


                atualizarContador();
            }
        }
    );


    btnSair.addEventListener(
        "click",
        () => {

            signOut(auth).then(() => {

                window.location.href =
                    "../auth/login.html";
            });
        }
    );

</script>
